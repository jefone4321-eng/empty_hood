
services:
  EmptyHood_mysql:
    image: mysql:8.0
    container_name: EmptyHood_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3308:3306"
    volumes:
      - EmptyHood_db_data:/var/lib/mysql
    networks:
      - EmptyHood_network

  EmptyHood_phpmyadmin:
    image: phpmyadmin
    container_name: EmptyHood_phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: EmptyHood_mysql
    ports:
      -  "8082:80"
    networks:
      - EmptyHood_network

volumes:
  EmptyHood_db_data:
    name: EmptyHood_db_data

networks:
  EmptyHood_network: